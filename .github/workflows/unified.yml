name: Unified bundled build
on:
  workflow_dispatch:
  push:
    branches: [unified-manager]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      scheme: LiveContainer
      archive_path: archive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          xcodebuild -version | tee build-logs/toolchain.log
          xcodebuild archive -project LiveContainer.xcodeproj -scheme LiveContainer -archivePath archive -sdk iphoneos -arch arm64 -configuration Release CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-logs/archive.log
      - name: Package combined IPA
        shell: bash
        run: |
          set -euo pipefail
          bash .github/build_github.sh 2>&1 | tee build-logs/package.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build-logs
      - uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-SideStore
          path: LiveContainer+SideStore.ipa
          if-no-files-found: error
