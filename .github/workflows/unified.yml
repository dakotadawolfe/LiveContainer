name: Unified bundled build
on:
  workflow_dispatch:
  push:
    branches: [main, unified-manager]
    paths-ignore: ['docs/**', '*.md']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      scheme: LiveContainer
      archive_path: archive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Build pinned StikJIT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          git clone https://github.com/StikDebug/StikJIT.git .build/StikJIT
          git -C .build/StikJIT checkout 32287268fa5824f9edce4cb359f5833ce0cf7b00
          brew install xcodegen
          (cd .build/StikJIT && xcodegen generate && xcodebuild archive -project StikJIT.xcodeproj -scheme StikJIT -destination 'generic/platform=iOS' -archivePath build/StikJIT SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=NO SWIFT_EMIT_MODULE_INTERFACE=NO GENERATE_INFOPLIST_FILE=YES CODE_SIGNING_ALLOWED=NO) 2>&1 | tee build-logs/stikjit.log
          rm -rf StikJITHeadless/StikJIT.xcframework
          xcodebuild -create-xcframework -allow-internal-distribution -framework .build/StikJIT/build/StikJIT.xcarchive/Products/Library/Frameworks/StikJIT.framework -output StikJITHeadless/StikJIT.xcframework
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          swift test 2>&1 | tee build-logs/rules-tests.log
          python3 -m unittest discover -s Tests -p 'test_*.py' -v 2>&1 | tee build-logs/packaging-tests.log
          xcodebuild -version | tee build-logs/toolchain.log
          xcodebuild archive -project LiveContainer.xcodeproj -scheme LiveContainer -archivePath archive -sdk iphoneos -arch arm64 -configuration Release CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-logs/archive.log
      - name: Build pinned embedded SideStore
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/LiveContainer/SideStore.git .build/SideStore
          git -C .build/SideStore checkout ee3cc16a67f9fed766f79a0ed70938f0f8ad5a07
          git -C .build/SideStore submodule update --init --recursive
          python3 scripts/prepare_sidestore.py .build/SideStore
          brew install ldid
          (cd .build/SideStore && make build fakesign ipa) 2>&1 | tee build-logs/sidestore.log
      - name: Package combined IPA
        shell: bash
        run: |
          set -euo pipefail
          SIDESTORE_IPA="$PWD/.build/SideStore/SideStore.ipa" bash .github/build_github.sh 2>&1 | tee build-logs/package.log
          python3 scripts/inspect_ipa.py LiveContainer+SideStore.ipa | tee build-logs/ipa-inspection.json
          python3 scripts/inspect_entitlements.py LiveContainer+SideStore.ipa | tee build-logs/entitlement-inspection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build-logs
      - uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-SideStore
          path: LiveContainer+SideStore.ipa
          if-no-files-found: error
